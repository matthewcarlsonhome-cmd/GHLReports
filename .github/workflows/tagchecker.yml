# Daily tag/pixel firing check (docs/FORMS-INTEGRATION.md Phase 2).
#
# Loads each configured client website in headless Chromium and verifies the
# expected tracking tags (GA4 / GTM / Meta pixel / Google Ads / TikTok)
# actually fire. Configuration lives in the database
# (subaccounts.tag_config); accounts with no expectations are skipped, so
# this workflow is a fast no-op until tags are configured.
#
# GitHub-hosted runners have plenty of RAM for Chromium — this is why the
# tag checker lives here rather than on a small Render instance.
#
# Needs only two secrets (no GHL tokens are involved at all):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
name: Tag checker

on:
  schedule:
    - cron: "0 13 * * *"        # 08:00 America/Chicago during CDT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print results without writing to the database"
        type: boolean
        required: false
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tagchecker/requirements.txt

      - name: Install dependencies
        run: pip install -r tagchecker/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check tags
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m tagchecker.main ${{ inputs.dry_run == true && '--dry-run' || '' }}
