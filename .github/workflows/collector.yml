# Nightly GHL data collection — the primary scheduler for collector/.
# (render.yaml remains as an optional alternative; run one, not both.)
#
# Schedule: 10:30 UTC = 05:30 America/Chicago during CDT. GitHub cron is
# best-effort (runs can start some minutes late) — fine for a nightly job.
#
# Manual runs: Actions tab -> "Nightly collector" -> Run workflow. The `args`
# box feeds COLLECTOR_ARGS, which collector/main.py already understands:
#   --probe            verify API field names (report prints in the log)
#   --backfill 12      load 12 weeks of lead history
#   --digest --dry-run preview digest emails without sending
#   (empty)            normal full collection
#
# A run goes RED when any location is held or failed (collector exit code 2)
# — that is the dead-man's switch; GitHub emails the repo owner on scheduled-
# workflow failure. Accounts merely awaiting their token do NOT fail the run.
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, COLLECTOR_KEY — the same three
#   values Render used. PITs stay in the Supabase Vault, never here.
#   Optional, for the Monday digest emails: SMTP_USER + SMTP_PASS (the same
#   Google Workspace account + app password the Supabase auth mailer uses)
#   and DIGEST_CC (comma list CC'd on every digest). Unset = digest skipped.
#
# Security notes (details and fixes in docs/SECURITY-SPEC.md):
#   * This repository is public, so this workflow's logs are public too.
#     Do not set its secrets, and do not run --probe, --dry-run or
#     --digest --dry-run here, until the repository is private: those modes
#     print lead names, deal names and digest text to the log (SEC-01, SEC-04).
#   * Render is the scheduler actually in use. This schedule fails every day
#     because the secrets above are unset (SEC-15). Pause it or finish the
#     cutover, and never run both schedulers: the digest would go out twice.
#   * The `args` box reaches the collector only through the COLLECTOR_ARGS
#     environment variable (never pasted into the shell command), so it cannot
#     inject shell commands. It does accept every collector flag, including
#     ones that send email or post to the GHL webhook (--digest, --send-test).
#   * There is no `permissions:` block yet, so the job gets the repository's
#     default GITHUB_TOKEN rights, and actions are pinned by version tag
#     rather than commit SHA (SEC-15).
name: Nightly collector

on:
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Collector args (--probe, --backfill 12, ...); empty = normal run"
        required: false
        default: ""

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Put this repository's code on the runner.
      - uses: actions/checkout@v4

      # Python 3.11, with pip's download cache keyed on the requirements file.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      # Versions are not locked yet (SEC-06): each run installs the newest
      # releases the `>=` ranges allow.
      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      # Secrets exist only inside this step, as environment variables. GHL
      # tokens (PITs) are fetched from Supabase Vault at run time and never
      # pass through GitHub.
      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
          COLLECTOR_ARGS: ${{ inputs.args }}
          GHL_APP_BASE: https://crm.smallscreenproducer.com
          TZ: America/Chicago
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_CC: ${{ secrets.DIGEST_CC }}
        run: python -m collector.main
