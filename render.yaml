# OPTIONAL ALTERNATIVE — the primary scheduler is GitHub Actions
# (.github/workflows/collector.yml). Keep exactly ONE of the two enabled:
# if the GitHub Actions workflow is running nightly, suspend or delete the
# Render cron job so the collector doesn't run twice per night.
services:
  - type: cron
    name: ghl-health-collector
    runtime: python
    plan: starter
    schedule: "30 10 * * *"        # 05:30 America/Chicago during CDT; revisit in November
    buildCommand: pip install -r collector/requirements.txt
    startCommand: python -m collector.main
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COLLECTOR_KEY
        sync: false
      - key: GHL_APP_BASE
        value: https://crm.smallscreenproducer.com
      - key: TZ
        value: America/Chicago
      # Monday digest emails (optional): the same Google Workspace account +
      # app password the Supabase auth mailer uses. Unset = digest skipped.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DIGEST_CC          # optional, comma list CC'd on every digest
        sync: false
      # -- AM notes (collector/automation.py, docs/AM-NOTIFY-WORKFLOW-SPEC.md) --
      # AUTOMATION_WEBHOOKS is the kill switch: off (default) does nothing,
      # dry runs everything and logs the notes instead of posting them, on
      # posts to the GHL workflow. Flip it here and press Trigger Run; no
      # deploy needed.
      - key: AUTOMATION_WEBHOOKS
        value: "off"
      - key: AUTOMATION_WEBHOOK_URL   # the GHL Inbound Webhook URL — treat as a secret
        sync: false
      # Comma list of AM addresses allowed to receive notes. Empty = nobody.
      # Pilot: lhoffman@, ldegner@, mcarlson@ (all @smallscreenproducer.com).
      - key: AM_NOTIFY_ALLOWLIST
        sync: false
      # Shadow week only: send every note here instead, labelled with the AM
      # it was meant for. Clear it to go live.
      - key: AM_NOTIFY_REDIRECT
        sync: false
      # That is the complete secret set. PITs are in Supabase Vault, not here.
      #
      # One-off modes without a terminal: set COLLECTOR_ARGS in the Render
      # dashboard (e.g. "--probe", "--backfill 12"), click "Trigger Run",
      # read the logs, then clear it to resume nightly runs.
