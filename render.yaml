# LIVE SCHEDULER (as of 2026-09-28): this Render cron job runs the nightly
# collector. The GitHub Actions copy (.github/workflows/collector.yml) was
# meant to replace it, but its secrets were never set and it fails every day.
# If that cutover ever happens, suspend this job first: exactly ONE
# scheduler may run, or the collector runs twice a night.
services:
  - type: cron
    name: ghl-health-collector
    runtime: python
    plan: starter
    schedule: "30 10 * * *"        # 05:30 America/Chicago during CDT; revisit in November
    buildCommand: pip install -r collector/requirements.txt
    startCommand: python -m collector.main
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COLLECTOR_KEY
        sync: false
      - key: GHL_APP_BASE
        value: https://crm.smallscreenproducer.com
      - key: TZ
        value: America/Chicago
      # Monday digest emails (optional): the same Google Workspace account +
      # app password the Supabase auth mailer uses. Unset = digest skipped.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DIGEST_CC          # optional, comma list CC'd on every digest
        sync: false
      # Who receives the digest. NOBODY unless one of these is set.
      # DIGEST_REDIRECT: one address that gets EVERY AM's digest, subject
      # labelled "[for Lauren]", no CC (the rehearsal; for now
      # mcarlson@smallscreenproducer.com). DIGEST_ALLOWLIST: comma list; with
      # no redirect, only listed AMs (and listed DIGEST_CC addresses) get it.
      - key: DIGEST_REDIRECT
        sync: false
      - key: DIGEST_ALLOWLIST
        sync: false
      # -- AM notes (collector/automation.py, docs/AM-NOTIFY-WORKFLOW-SPEC.md) --
      # AUTOMATION_WEBHOOKS is the kill switch: off (default) does nothing,
      # dry runs everything and logs the notes instead of posting them, on
      # posts to the GHL workflow. Changing it needs no deploy; it applies
      # to the next run. Careful: Trigger Run with COLLECTOR_ARGS empty is a
      # full nightly run, and on a Monday that includes the digest.
      - key: AUTOMATION_WEBHOOKS
        value: "off"
      - key: AUTOMATION_WEBHOOK_URL   # the GHL Inbound Webhook URL — treat as a secret
        sync: false
      # Comma list of AM addresses allowed to receive notes. Empty = nobody.
      # Pilot: lhoffman@, ldegner@, mcarlson@ (all @smallscreenproducer.com).
      - key: AM_NOTIFY_ALLOWLIST
        sync: false
      # Shadow week only: send every note here instead, labelled with the AM
      # it was meant for. Clear it to go live.
      - key: AM_NOTIFY_REDIRECT
        sync: false
      # That is the complete secret set. PITs are in Supabase Vault, not here.
      #
      # One-off modes without a terminal: set COLLECTOR_ARGS in the Render
      # dashboard (e.g. "--probe", "--backfill 12"), click "Trigger Run",
      # read the logs, then clear it to resume nightly runs. With
      # COLLECTOR_ARGS empty, Trigger Run is a full nightly run (on a Monday,
      # digest included).
